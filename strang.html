function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

var aktuell = null;

/* Nur Hashes, die einen Strang benennen, wechseln die Seite.
   Alles andere (#faden, #buchen) bleibt ein gewöhnlicher Sprunganker —
   #buchen gehört fest zur sp_ce-Seite und rendert sie beim Direktaufruf. */
function strangAusHash() {
  var slug = (location.hash || '').replace('#', '');
  if (!slug) return STRAENGE[0];
  if (slug === 'buchen') return STRAENGE.filter(function (d) { return d.slug === 'space'; })[0];
  var treffer = STRAENGE.filter(function (d) { return d.slug === slug; })[0];
  return treffer || aktuell || STRAENGE[0];
}

function zeichne() {
  var s = strangAusHash();
  if (s === aktuell) return false;
  aktuell = s;
  var h = [];

  h.push('<section class="strang-kopfbereich" style="background:linear-gradient(165deg,' + s.color + ',' + s.dark + ');color:' + s.fg + '">');
  h.push('<span class="strang-punkt" style="left:68%;top:20%;width:13px;height:13px;animation:einblenden 2s 2.4s both,wandern1 11s -3s infinite"></span>');
  h.push('<span class="strang-punkt" style="left:82%;top:55%;width:8px;height:8px;animation:einblenden 2s 3.6s both,wandern3 13s -6s infinite"></span>');
  h.push('<span class="strang-punkt" style="left:58%;top:70%;width:10px;height:10px;animation:einblenden 2s 5s both,wandern2 9.5s -2s infinite"></span>');
  h.push('<p class="strang-meta">Strang ' + esc(s.num) + ' · ' + esc(s.ton) + '</p>');
  h.push('<h1 class="strang-name">' + esc(s.name) + '</h1>');
  if (s.claim) h.push('<p class="strang-claim">' + esc(s.claim) + '</p>');
  if (s.sub)   h.push('<p class="strang-sub">' + esc(s.sub) + '</p>');
  h.push('<p class="strang-oneliner">' + esc(s.oneliner) + '</p>');
  if (s.link)  h.push('<p class="strang-extlink"><a href="' + esc(s.link) + '" target="_blank" rel="noopener">→ ' + esc(s.linkLabel) + '</a></p>');
  if (s.alt)   h.push('<p class="strang-alt">' + esc(s.alt) + '</p>');
  h.push('</section>');

  h.push('<section class="abschnitt"><p class="rubrik">Worum es geht</p><p class="abschnitt-text">' + esc(s.lede) + '</p></section>');

  if (s.bloecke && s.bloecke.length) {
    h.push('<section class="bloecke">');
    s.bloecke.forEach(function (b) {
      h.push('<article class="block"><h3>' + esc(b.h) + '</h3><p>' + esc(b.p) + '</p>');
      if (b.a) h.push('<p class="block-link"><a href="' + esc(b.a.href) + '">' + esc(b.a.label) + '</a></p>');
      h.push('</article>');
    });
    h.push('</section>');
  }

  if (s.buchung) {
    h.push('<section class="abschnitt--eng buchen" id="buchen">');
    h.push('<p class="rubrik">Buchung</p>');
    h.push('<h2 class="buchen-titel">' + esc(s.buchung.titel) + '</h2>');
    h.push('<p class="buchen-zeile">' + esc(s.buchung.zeile) + '</p>');
    h.push('<div class="buchen-karte"><div id="spce-booking"></div></div>');
    h.push('<p class="buchen-fallback"><a href="https://cal.com/' + esc(s.buchung.calLink) + '" target="_blank" rel="noopener">Buchungsseite direkt öffnen →</a></p>');
    h.push('<p class="buchen-kurzfristig">Kurzfristiger als 48 Stunden? <a href="mailto:hello@oswaldkoenig.ch?subject=' + encodeURIComponent('Raum buchen — kurzfristig') + '">Schreib direkt: hello@oswaldkoenig.ch</a></p>');
    h.push('</section>');
  }

  if (s.linien && s.linien.length) {
    h.push('<section class="linien">');
    s.linien.forEach(function (ln) {
      h.push('<div><h3>' + esc(ln.h) + '</h3>');
      ln.items.forEach(function (it) {
        h.push('<div class="linien-eintrag"><span class="t">' + esc(it.t) + '</span><span class="m">' + esc(it.m) + '</span></div>');
      });
      h.push('</div>');
    });
    h.push('</section>');
  }

  if (s.knoten && s.knoten.length) {
    h.push('<section class="abschnitt--eng"><p class="rubrik" style="margin-bottom:22px">Die Knoten · Neustes zuoberst</p><div class="knoten-liste">');
    s.knoten.forEach(function (k) {
      h.push('<article class="knoten' + (k.big ? ' knoten--gross' : '') + '">');
      h.push('<span class="knoten-punkt"></span>');
      h.push('<h3>' + esc(k.t) + '</h3><p class="m">' + esc(k.m) + '</p>');
      if (k.d) h.push('<p class="d">' + esc(k.d) + '</p>');
      h.push('</article>');
    });
    h.push('</div></section>');
  }

  if (s.fussnote) h.push('<section class="abschnitt--eng"><p class="fussnote">' + esc(s.fussnote) + '</p></section>');

  h.push('<section class="faden" id="faden" style="background:' + s.dark + '">');
  h.push('<h2>Faden aufnehmen</h2><p>' + esc(s.cta) + '</p>');
  h.push('<a class="faden-knopf" href="mailto:hello@oswaldkoenig.ch?subject=' + encodeURIComponent('Faden aufnehmen — ' + s.name) + '">hello@oswaldkoenig.ch</a>');
  h.push('</section>');

  h.push('<nav class="andere"><p class="rubrik">Andere Stränge</p><div class="andere-liste">');
  STRAENGE.forEach(function (a) {
    if (a.slug === s.slug) return;
    h.push('<a href="#' + a.slug + '"><span class="punkt-statisch" style="background:' + a.color + '"></span>' + esc(a.name) + '</a>');
  });
  h.push('</div><div class="andere-fuss"><span>Ein Garten, kein Schaufenster · Draft — Referenz-Freigaben ausstehend</span><a href="index.html">← zur Hauptschnur</a></div></nav>');

  var root = document.getElementById('strang');
  root.innerHTML = h.join('');
  root.style.setProperty('--strang-farbe', s.color);
  root.style.setProperty('--strang-dunkel', s.dark);
  document.title = s.name + ' — oswaldkoenig.ch';
  return true;
}

window.addEventListener('hashchange', function () {
  if (zeichne()) {
    var anker = document.getElementById((location.hash || '').replace('#', ''));
    if (anker) window.scrollTo(0, anker.getBoundingClientRect().top + window.pageYOffset);
    else window.scrollTo(0, 0);
  }
});
zeichne();

/* Beim Direktaufruf mit #faden oder #buchen trotzdem zum Block springen */
(function () {
  var sprung = (location.hash || '').replace('#', '');
  if (sprung !== 'faden' && sprung !== 'buchen') return;
  var ziel = document.getElementById(sprung);
  if (ziel) window.scrollTo(0, ziel.getBoundingClientRect().top + window.pageYOffset);
})();
</script>
